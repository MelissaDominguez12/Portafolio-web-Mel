<section id="contacto" class="w-full px-8 py-24 font-poppins bg-white">
  <div class="max-w-4xl mx-auto text-center" data-aos="fade-down">
    <h2 class="text-5xl font-bold text-[#E83866] font-raleway mb-4 tracking-wide">Contacto</h2>
    <p class="text-lg text-[#111] mb-12">
      ¿Te gustaría trabajar conmigo o saber más sobre mis proyectos? <br />
      No dudes en escribirme. ¡Estoy feliz de conectar contigo!
    </p>
  </div>

  <div class="max-w-3xl mx-auto bg-[#FFEE8C] p-8 rounded-xl shadow-lg space-y-6" data-aos="fade-up">
    <!-- Formulario -->
    <form action="https://formspree.io/f/xpwlolke" method="POST" class="space-y-6">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <input
          type="text"
          name="nombre"
          placeholder="Nombre"
          required
          class="w-full px-4 py-3 rounded-md border border-gray-300 text-[#111] focus:outline-none focus:ring-2 focus:ring-[#F7873F]"
        />
        <input
          type="email"
          name="email"
          placeholder="Correo electrónico"
          required
          class="w-full px-4 py-3 rounded-md border border-gray-300 text-[#111] focus:outline-none focus:ring-2 focus:ring-[#F7873F]"
        />
      </div>
      <textarea
        name="mensaje"
        rows="5"
        placeholder="Escribe tu mensaje..."
        required
        class="w-full px-4 py-3 rounded-md border border-gray-300 text-[#111] focus:outline-none focus:ring-2 focus:ring-[#F7873F]"
      ></textarea>

      <button
        type="submit"
        class="bg-[#E83866] text-white px-6 py-3 rounded-full font-semibold hover:bg-[#bc244a] transition"
      >
        Enviar mensaje
      </button>
    </form>

    <!-- Redes sociales -->
    <div class="flex justify-center gap-6 pt-6">
      <a href="mailto:melissadore02@gmail.com" target="_blank" class="hover:scale-110 transition">
        <img src="assets/gmail.svg" alt="Gmail" class="w-10 h-10" />
      </a>
      <a href="www.linkedin.com/in/dominguez-melissa-2a8955230" target="_blank" class="hover:scale-110 transition">
        <img src="assets/linkedin.svg" alt="LinkedIn" class="w-10 h-10" />
      </a>
      <a href="https://github.com/MelissaDominguez12" target="_blank" class="hover:scale-110 transition">
        <img src="assets/github.svg" alt="GitHub" class="w-10 h-10" />
      </a>
    </div>
  </div>
</section>
